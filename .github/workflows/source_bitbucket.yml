name: Source Plugin Bitbucket Workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "plugins/source/bitbucket/**"
      - ".github/workflows/source_bitbucket.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/source/bitbucket/**"
      - ".github/workflows/source_bitbucket.yml"

permissions:
  contents: read

jobs:
  plugins-source-bitbucket:
    timeout-minutes: 30
    name: "plugins/source/bitbucket"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugins/source/bitbucket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: "temurin"
          java-version: "20"
          cache: "gradle"
          cache-dependency-path: "plugins/source/bitbucket/**/build.gradle"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build package
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"
          require_passed_tests: true
          fail_on_failure: true
  
