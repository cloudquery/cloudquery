name: Source Plugin Bitbucket Workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "plugins/source/bitbucket/**"
      - ".github/workflows/source_bitbucket.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/source/bitbucket/**"
      - ".github/workflows/source_bitbucket.yml"

permissions:
  contents: read

jobs:
  plugins-source-bitbucket:
    timeout-minutes: 30
    name: "plugins/source/bitbucket"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugins/source/bitbucket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: "temurin"
          java-version: "20"
          cache: "gradle"
          cache-dependency-path: "plugins/source/bitbucket/**/build.gradle"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build package
        run: ./gradlew build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@8a133bfa3ecb0ea9024c1e2ae788b4c25f6cdb9d # v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"
          require_passed_tests: true
          fail_on_failure: true
  
