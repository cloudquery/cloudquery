on:
  workflow_call:
    inputs:
      files:
        required: false
        type: string
        default: "**/*"
      files_ignore:
        required: false
        type: string
        default: ""
      dir_names:
        required: false
        type: boolean
        default: false
      trigger_paths:
        description: "Match the calling workflow's pull_request paths filter instead of files"
        required: false
        type: boolean
        default: false
    outputs:
      any_changed:
        description: "Whether any files changed"
        value: ${{ jobs.changed-files.outputs.any_changed }}
      changed_files:
        description: "All changed files"
        value: ${{ jobs.changed-files.outputs.changed_files }}

permissions:
  contents: read

jobs:
  changed-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any_changed: ${{ fromJson(steps.changed-files.outputs.result).any_changed }}
      changed_files: ${{ fromJson(steps.changed-files.outputs.result).changed_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github
            scripts/workflows
      - name: Install micromatch
        run: npm i -D micromatch@4.0.8
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: changed-files
        env:
          files: ${{ inputs.files }}
          files_ignore: ${{ inputs.files_ignore }}
          dir_names: ${{ inputs.dir_names }}
          trigger_paths: ${{ inputs.trigger_paths }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const path = require('path')
            const micromatch = require('micromatch')
            const { listChangedFiles, triggerPaths, workflowFileOf } = require('./scripts/workflows/changed_files.js')
            const files = await listChangedFiles({ github, context })
            if (!files) {
              console.log(`Changed files unknown for ${context.eventName} ${context.ref}, treating everything as changed`)
              return { any_changed: true, changed_files: '' }
            }
            const patternsToMatch = process.env.trigger_paths == 'true'
              ? triggerPaths(workflowFileOf(process.env.WORKFLOW_REF))
              : process.env.files.split('\n').filter(Boolean)
            const patternsToIgnore = process.env.files_ignore.split('\n').filter(Boolean)
            const onlyNames = [...new Set(files.map(file => process.env.dir_names == 'true' ? path.dirname(file) : file))]
            console.log('All changed files:', onlyNames)
            const allPatterns = [...patternsToMatch, ...patternsToIgnore.map(pattern => `!${pattern}`)]
            console.log('All patterns:', allPatterns)
            const afterPatterns = micromatch(onlyNames, allPatterns, { dot: true })
            console.log('After patterns:', afterPatterns)
            return {
              any_changed: afterPatterns.length > 0,
              changed_files: afterPatterns.join(' '),
            }
