name: Transformer Plugin JSON Workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "plugins/transformer/jsonflattener/**"
      - ".github/workflows/transf_jsonflattener.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/transformer/jsonflattener/**"
      - ".github/workflows/transf_jsonflattener.yml"

permissions:
  contents: read

jobs:
  plugins-transformer-json:
    timeout-minutes: 30
    name: "plugins/transformer/jsonflattener"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugins/transformer/jsonflattener
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Set up Go 1.x
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: plugins/transformer/jsonflattener/go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-test-transformer-jsonflattener-${{ hashFiles('plugins/transformer/jsonflattener/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-test-transformer-jsonflattener-
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: plugins/transformer/jsonflattener
          args: "--config ../../.golangci.yml"
      - name: Build
        run: go build .
      - name: Test
        run: make test
  