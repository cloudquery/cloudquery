name: Destination Plugin SQLite-Python Workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "plugins/destination/sqlite-python/**"
      - ".github/workflows/dest_sqlite_python.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/destination/sqlite-python/**"
      - ".github/workflows/dest_sqlite_python.yml"

permissions:
  contents: read

jobs:
  plugins-destination-sqlite-python:
    timeout-minutes: 30
    name: "plugins/destination/sqlite-python"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugins/destination/sqlite-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync
      - name: Check formatting
        run: make fmt-check
      -
        # Required for the package command tests to work
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Run tests
        run: make test
  
