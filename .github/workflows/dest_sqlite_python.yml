name: Destination Plugin SQLite-Python Workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "plugins/destination/sqlite-python/**"
      - ".github/workflows/dest_sqlite_python.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/destination/sqlite-python/**"
      - ".github/workflows/dest_sqlite_python.yml"

permissions:
  contents: read

jobs:
  plugins-destination-sqlite-python:
    timeout-minutes: 30
    name: "plugins/destination/sqlite-python"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugins/destination/sqlite-python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: uv sync
      - name: Check formatting
        run: make fmt-check
      -
        # Required for the package command tests to work
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Run tests
        run: make test
  
