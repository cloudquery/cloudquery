name: release-scaffold
on:
  push:
    tags:
      - "scaffold-v*.*.*"
env:
  CGO_ENABLED: 0

permissions:
  contents: read

jobs:
  release-scaffold:
    timeout-minutes: 30
    outputs:
      version: ${{ steps.split.outputs.version }}
      published: ${{ steps.published.outputs.published }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token for release
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.CQ_APP_ID }}
          private-key: ${{ secrets.CQ_APP_PRIVATE_KEY }}
          repositories: |
            cloudquery
            homebrew-tap
          permission-contents: write
      # Tag format is scaffold-<version>
      - name: Split tag
        id: split
        run: |
          tag=${{github.ref_name}}
          echo "version=$(echo $tag | cut -d- -f2-)" >> $GITHUB_OUTPUT
      # Fail if not a valid SemVer string
      - name: Parse semver string
        id: semver_parser
        uses: booxmedialtd/ws-action-parse-semver@7784200024d6b3fc01253e617ec0168daf603de3
        with:
          input_string: ${{steps.split.outputs.version}}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Set up Go 1.x
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: scaffold/go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-release-cache-scaffold-${{ hashFiles('scaffold/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-release-cache-scaffold-
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser-pro
          version: "v2.14.3"
          install-only: true
      - name: Run GoReleaser Dry-Run
        run: goreleaser release --snapshot --clean --skip=validate,publish -f ./scaffold/.goreleaser.yaml
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # Publish to GitHub and Homebrew
      - name: Run GoReleaser Release
        if: steps.semver_parser.outputs.prerelease == ''
        run: goreleaser release --clean -f ./scaffold/.goreleaser.yaml
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # A custom token is required for publishing to Homebrew
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Publish only to GitHub
      - name: Run GoReleaser PreRelease
        if: steps.semver_parser.outputs.prerelease != ''
        run: goreleaser release --clean -f ./scaffold/.goreleaser.prerelease.yaml
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # A custom token is required for publishing to Homebrew
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Mark release published
        id: published
        if: steps.semver_parser.outputs.prerelease == ''
        run: echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token for frontend
        id: frontend-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.CQ_APP_ID }}
          private-key: ${{ secrets.CQ_APP_PRIVATE_KEY }}
          repositories: |
            frontend
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.frontend-app-token.outputs.token }}
          repository: cloudquery/frontend
          ref: main
          path: ./frontend

      - name: Update version file
        if: steps.semver_parser.outputs.prerelease == ''
        run: 'echo "{ \"latest\": \"${{github.ref_name}}\" }" > ./frontend/apps/docs/versions/scaffold.json'

      - name: Create Pull Request
        if: steps.semver_parser.outputs.prerelease == ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # required so the PR triggers workflow runs
          token: ${{ steps.frontend-app-token.outputs.token }}
          path: frontend
          branch: chore/update-scaffold-version
          base: main
          title: "chore: Update Scaffold version to ${{steps.split.outputs.version}}"
          commit-message: "chore: Update Scaffold version to ${{steps.split.outputs.version}}"
          body: Updates Scaffold latest version to ${{steps.split.outputs.version}}
          labels: automerge
      - name: Slack Notify
        uses: ravsamhq/notify-slack-action@0670a0482d2a919531ba3b219e0c535fe4fcc791
        if: always()
        with:
          status: ${{ job.status }}
          notify_when: "failure"
          notification_title: "Failed to release Scaffold ${{ steps.split.outputs.version }}"
          footer: "<{repo_url}|{repo}>"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ALERTS_INTEGRATIONS_SLACK_WEBHOOK_URL }}

  push-tags:
    permissions: {}
    needs: release-scaffold
    if: always() && needs.release-scaffold.outputs.published == 'true'
    uses: ./.github/workflows/push_tags.yml
    with:
      tags: scaffold/${{ needs.release-scaffold.outputs.version }}
      notification_title: "Failed to push tag scaffold/${{ needs.release-scaffold.outputs.version }}"
    secrets:
      CQ_APP_ID: ${{ secrets.CQ_APP_ID }}
      CQ_APP_PRIVATE_KEY: ${{ secrets.CQ_APP_PRIVATE_KEY }}
      ALERTS_INTEGRATIONS_SLACK_WEBHOOK_URL: ${{ secrets.ALERTS_INTEGRATIONS_SLACK_WEBHOOK_URL }}
