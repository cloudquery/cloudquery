name: Source Plugin Hacker News Workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'plugins/source/hackernews/**'
      - '.github/workflows/source_hackernews.yml'
  push:
    branches:
      - main
    paths:
      - 'plugins/source/hackernews/**'
      - '.github/workflows/source_hackernews.yml'

permissions:
  contents: read

jobs:
  plugins-source-hackernews:
    timeout-minutes: 30
    name: 'plugins/source/hackernews'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugins/source/hackernews
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Set up Go 1.x
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: plugins/source/hackernews/go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-test-source-hackernews-${{ hashFiles('plugins/source/hackernews/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.setup-go.outputs.go-version }}-test-source-hackernews-
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: plugins/source/hackernews
          args: '--config ../../.golangci.yml'
      - name: Setup CloudQuery
        if: github.event_name == 'pull_request'
        uses: cloudquery/setup-cloudquery@757b19eb8496cf9e89a78de54f2c677253f54f6b # v5.0.3
        with:
          version: v6.41.1
      - name: gen
        if: github.event_name == 'pull_request'
        run: make gen
      - name: Fail if generation updated files
        if: github.event_name == 'pull_request'
        run: test "$(git status -s | wc -l)" -eq 0 || (git status -s; exit 1)
      - name: Build
        run: go build .
      - name: Test
        run: make test
