kind: source
spec:
  name: datadog
  path: cloudquery/datadog
  registry: cloudquery
  version: v5.19.10
  tables: ["*"]
  destinations: [postgresql]
  spec:
    accounts:
      - name: placeholder
        api_key: placeholder
        app_key: placeholder
---
kind: destination
spec:
  name: postgresql
  path: ${UPGRADE_CHECK_POSTGRESQL_PATH}
  registry: local
  write_mode: overwrite-delete-stale
  spec:
    connection_string: postgres://localhost:1/unreachable
