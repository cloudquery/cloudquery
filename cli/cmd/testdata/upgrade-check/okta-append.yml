kind: "source"
spec:
  name: "okta"
  path: "cloudquery/okta"
  registry: "cloudquery"
  version: "v6.8.2"
  tables: ["*"]
  destinations: ["postgresql"]
  spec:
    domain: "https://placeholder.okta.com"
    token: "placeholder"
---
kind: "destination"
spec:
  name: "postgresql"
  path: "cloudquery/postgresql"
  registry: "cloudquery"
  version: "v8.17.0" # latest version of postgresql plugin
  write_mode: "append"
  spec:
    connection_string: "postgres://localhost:1/unreachable"
