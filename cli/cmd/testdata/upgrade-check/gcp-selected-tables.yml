kind: "source"
spec:
  name: "gcp"
  path: "cloudquery/gcp"
  registry: "cloudquery"
  version: "v22.1.2"
  tables:
    - "gcp_aiplatform_specialist_pools"
    - "gcp_aiplatform_specialistpool_locations"
  destinations: ["postgresql"]
  spec:
    project_ids: ["placeholder"]
---
kind: "destination"
spec:
  name: "postgresql"
  path: "cloudquery/postgresql"
  registry: "cloudquery"
  version: "v8.16.0" # latest version of postgresql plugin
  write_mode: "overwrite-delete-stale"
  spec:
    connection_string: "postgres://localhost:1/unreachable"
