kind: source
spec:
  name: okta
  path: cloudquery/okta
  registry: cloudquery
  version: v6.8.2
  tables: ["*"]
  destinations: [postgresql]
  spec:
    domain: https://placeholder.okta.com
    token: placeholder
---
kind: destination
spec:
  name: postgresql
  path: ${UPGRADE_CHECK_POSTGRESQL_PATH}
  registry: local
  write_mode: overwrite-delete-stale
  spec:
    connection_string: postgres://localhost:1/unreachable
